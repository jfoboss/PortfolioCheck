<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2A44"/><stop offset="1" stop-color="#0E1728"/>
    </linearGradient>
    <linearGradient id="coin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFE38A"/><stop offset="0.5" stop-color="#F2B92B"/><stop offset="1" stop-color="#B8801A"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3C2"/><stop offset="1" stop-color="#9C6B12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- фон в стиле macOS: скруглённый квадрат -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- тонкая «сетка» роста на фоне -->
  <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="6" fill="none">
    <polyline points="140,720 300,600 440,640 600,470 760,420 900,300"/>
    <line x1="140" y1="800" x2="900" y2="800"/>
  </g>
  <!-- монета -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="500" r="292" fill="url(#rim)"/>
    <circle cx="512" cy="500" r="256" fill="url(#coin)"/>
    <circle cx="512" cy="500" r="256" fill="none" stroke="#7A5210" stroke-opacity="0.35" stroke-width="10"/>
    <!-- насечки по ободу -->
    <g stroke="#7A5210" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round">
      <line x1="512" y1="228" x2="512" y2="254"/><line x1="512" y1="746" x2="512" y2="772"/>
      <line x1="240" y1="500" x2="266" y2="500"/><line x1="758" y1="500" x2="784" y2="500"/>
      <line x1="320" y1="308" x2="338" y2="326"/><line x1="686" y1="674" x2="704" y2="692"/>
      <line x1="704" y1="308" x2="686" y2="326"/><line x1="338" y1="674" x2="320" y2="692"/>
    </g>
    <!-- знак рубля -->
    <text x="512" y="600" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="330" fill="#5A3B08" fill-opacity="0.9">₽</text>
  </g>
  <!-- зелёная отметка «по правилам» -->
  <g filter="url(#shadow)">
    <circle cx="742" cy="722" r="118" fill="#34C759"/>
    <circle cx="742" cy="722" r="118" fill="none" stroke="#0E1728" stroke-width="22"/>
    <polyline points="682,724 726,768 806,678" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
